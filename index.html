<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="dheeraj bhai — BHP School, Satrod. Google Street View in pure 3D panorama mode. No 2D map." />
    <title>dheeraj bhai · BHP School</title>
  </head>
  <body>
    <div id="app">
      <!-- Fullscreen webview: Google's own Street View embed, no API key needed. -->
      <iframe
        id="sv-frame"
        title="Google Street View 3D panorama"
        allow="fullscreen; geolocation; accelerometer; gyroscope; magnetometer; autoplay"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>

      <!-- Optional cosmetic cover for Google's corner branding (see CONFIG.cleanMode). -->
      <div class="clean-cover" aria-hidden="true">
        <span class="clean-cover-top"></span>
        <span class="clean-cover-side"></span>
      </div>

      <header class="topbar safe-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">dheeraj <span>bhai</span></span>
        </div>
        <div class="location">
          <span class="location-area" id="area-name">—</span>
          <span class="location-spot" id="spot-name">Loading…</span>
        </div>
        <button class="icon-btn" id="fullscreen-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </header>

      <p class="hint safe-bottom" id="hint">Joystick: left/right to look · up/down to move</p>

      <div class="joystick" id="joystick" role="application" aria-label="Move and look joystick">
        <span class="joystick-cross" aria-hidden="true"></span>
        <span class="joystick-knob" id="joystick-knob" aria-hidden="true"></span>
      </div>

      <div class="overlay" id="overlay">
        <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
        <span class="overlay-text" id="overlay-text">Entering Street View…</span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
